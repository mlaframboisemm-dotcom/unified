services:
  - type: web
    name: sovereigns-pay-direct
    env: node
    plan: starter
    id: srv-d99sus57vvec7386p2p0
    rootDir: .
    buildCommand: npm run build
    startCommand: PORT=$PORT NODE_ENV=production node dist/server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WISE_PROFILE_ID
        value: "101924589"
      # Durable application state is deliberately stored on Render's mounted disk,
      # not in the source tree or a tracked database artifact.
      - key: SOVEREIGN_DB_FILE_PATH
        value: "/data/database.json"
      - key: SOVEREIGN_LEDGER_PATH
        value: "/data/ledger_db.json"
      - key: RENDER_SERVICE_ID
        value: "srv-d99sus57vvec7386p2p0"
    disk:
      name: ledger-db-volume
      mountPath: /data
      sizeGB: 1
