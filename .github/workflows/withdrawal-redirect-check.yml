name: Withdrawal Redirect Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  withdrawal-redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tangerine Withdrawal Redirect Smoke Test
        env:
          NODE_ENV: production
          SOVEREIGN_ENCRYPTION_KEY: 'abcdefghijklmnopqrstuvwxyzABCDEF012345'
          JWT_SECRET: 'abcdefghijklmnopqrstuvwxyzABCDEF012345'
          SOVEREIGN_ADMIN_EMAILS: 'admin@secure.local'
        run: npm run test:withdrawal:tangerine-redirect
