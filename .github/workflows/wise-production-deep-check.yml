name: Wise Production Deep Check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Suite mode"
        required: true
        default: "deep"
        type: choice
        options:
          - deep
          - fast

permissions:
  contents: read

jobs:
  wise-production-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: production
      WISE_API_TOKEN: ${{ secrets.WISE_API_TOKEN }}
      WISE_ALL_ACCESS_KEY: ${{ secrets.WISE_API_TOKEN }}
      WISE_PERSONAL_TOKEN: ${{ secrets.WISE_API_TOKEN }}
      WISE_ACCESS_TOKEN: ${{ secrets.WISE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate Wise Secret
        run: |
          if [ -z "${WISE_API_TOKEN}" ]; then
            echo "WISE_API_TOKEN is not configured; skipping the live Wise suite."
          else
            echo "WISE_API_TOKEN is configured; live Wise checks are enabled."
          fi

      - name: Run Wise Suite (Fast)
        if: ${{ inputs.mode == 'fast' && env.WISE_API_TOKEN != '' }}
        run: npm run test:wise-production-suite

      - name: Run Wise Suite (Deep)
        if: ${{ inputs.mode == 'deep' && env.WISE_API_TOKEN != '' }}
        run: npm run test:wise-production-suite:deep

      - name: Upload Suite Logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wise-production-suite-logs
          path: |
            *.log
            wise-*.txt
            WISE_SESSION_FULL.txt
          if-no-files-found: ignore
