name: Production Deployment Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Code Linter & Integrity Checks
        run: npm run lint

      - name: Compile Wise Dashboard Applet
        run: npm run compile_applet

      - name: Execute Cryptographic & Ledger Test Suite
        run: npm test

      # If all previous steps PASS, trigger Render to pull the fresh image
      - name: Trigger Render Zero-Downtime Live Deploy
        run: |
          echo "🚀 Initiating production deployment for srv-d99sus57vvec7386p2p0..."
          test -n "${{ secrets.RENDER_DEPLOY_HOOK_KEY }}" || { echo "Missing required repository secret: RENDER_DEPLOY_HOOK_KEY"; exit 1; }
          curl --fail --show-error --silent --retry 2 -X POST "https://api.render.com/deploy/srv-d99sus57vvec7386p2p0?key=${{ secrets.RENDER_DEPLOY_HOOK_KEY }}"
